<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>TAIO Clock</title>
  <link rel="stylesheet" href="clock.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="clock-header">
    <div class="brand-title">TAIO Time</div>
    <div class="drag-region"></div>
    <div class="header-actions">
      <!-- Nút mở Nhật ký hôm nay -->
      <button id="btnJournal" class="icon-btn" title="Mở nhật ký hôm nay (N)" aria-label="Nhật ký">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </button>
      <!-- 3 View Modes (v0.3.34 Part E4 & v0.3.47 Part D1 Lucide stroke 1.75px) -->
      <button id="btnModeRemaining" class="icon-btn active" title="Còn lại (1)" aria-label="Còn lại">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
        </svg>
      </button>
      <button id="btnModeElapsed" class="icon-btn" title="Đã dùng (2)" aria-label="Đã dùng">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="10" x2="14" y1="2" y2="2"></line><line x1="12" x2="15" y1="14" y2="11"></line><circle cx="12" cy="14" r="8"></circle>
        </svg>
      </button>
      <button id="btnModeGoal" class="icon-btn" title="Tiến độ mục tiêu (3)" aria-label="Mục tiêu">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle>
        </svg>
      </button>
      <!-- Nút đổi kiểu xem: Thanh / Vòng -->
      <button id="btnViewMode" class="icon-btn" title="Đổi kiểu xem: Thanh / Vòng (V)" aria-label="Kiểu xem">
        <svg id="viewModeIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
      </button>
      <!-- Nút Ghim -->
      <button id="btnPin" class="icon-btn active" title="Ghim luôn nổi trên cùng (P)" aria-label="Ghim">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
        </svg>
      </button>
      <!-- Nút Đóng -->
      <button id="btnClose" class="icon-btn" title="Đóng" aria-label="Đóng">&times;</button>
    </div>
  </header>

  <!-- View 1: Bar Mode -->
  <main id="barView" class="view-container">
    <div class="task-title" id="barTitle" title="Bấm để mở nhật ký">TAIO Time</div>
    <div class="subtitle-line" id="barSubtitle">Chưa có việc đang làm</div>

    <div class="timer-display">
      <div class="time-digits" id="barDigits">--:--</div>
    </div>

    <!-- Free Timers container (up to 3 independent timers, PRD v0.3.48 Part C4) -->
    <div id="barFreeTimersList" class="free-timers-list" style="display: none;"></div>

    <div class="progress-track" id="barProgressTrack">
      <div class="progress-fill" id="barProgress"></div>
    </div>

    <div class="bottom-bar" id="barBottomBar" style="display: none;">
      <button class="btn" id="barBtnExtend">+5p</button>
      <button class="btn" id="barBtnExtend15">+15p</button>
      <button class="btn primary" id="barBtnDone">✓ Kết thúc</button>
    </div>
    <div class="bottom-bar" id="barIdleBottomBar" style="display: flex;">
      <button class="btn" id="barBtnQuick15">+15p việc nhanh</button>
      <button class="btn primary" id="barBtnOpenJournal">📖 Mở nhật ký</button>
    </div>
  </main>

  <!-- View 2: Ring Mode -->
  <main id="ringView" class="view-container" style="display: none;">
    <div class="ring-wrapper" id="ringWrapper">
      <svg viewBox="0 0 120 120" class="ring-svg" id="ringSvg">
        <circle cx="60" cy="60" r="50" class="ring-track" stroke-width="8" fill="transparent" />
        <circle cx="60" cy="60" r="50" class="ring-progress" stroke-width="8" fill="transparent" id="ringCircle" />
      </svg>
      <div class="ring-center">
        <div class="ring-digits" id="ringDigits">--:--</div>
        <div class="ring-sub" id="ringSubText">thời gian trống</div>
      </div>
    </div>

    <div class="task-title" id="ringTitle" title="Bấm để mở nhật ký">TAIO Time</div>
    <div class="subtitle-line" id="ringSubtitle">Chưa có việc đang làm</div>

    <div class="bottom-bar" id="ringBottomBar" style="display: none;">
      <button class="btn" id="ringBtnExtend">+5p</button>
      <button class="btn" id="ringBtnExtend15">+15p</button>
      <button class="btn primary" id="ringBtnDone">✓ Kết thúc</button>
    </div>
    <div class="bottom-bar" id="ringIdleBottomBar" style="display: flex;">
      <button class="btn" id="ringBtnQuick15">+15p việc nhanh</button>
      <button class="btn primary" id="ringBtnOpenJournal">📖 Mở nhật ký</button>
    </div>
  </main>

  <!-- Motivation Line at Bottom -->
  <footer id="motivationFooter" class="motivation-line">
    <span id="quoteText" class="quote-text">Vạn dặm khởi đầu từ một bước chân</span>
  </footer>

  <!-- Quote detail popup -->
  <div id="quoteModal" class="quote-modal" style="display: none;">
    <div class="quote-content" id="modalQuoteContent"></div>
    <div class="quote-author" id="modalQuoteAuthor"></div>
    <div class="quote-actions">
      <button id="btnQuoteNext" class="quote-action-btn" title="Đổi câu khác">↻</button>
      <button id="btnQuoteFav" class="quote-action-btn" title="Yêu thích">♥</button>
      <button id="btnQuoteClose" class="quote-action-btn" title="Đóng">&times;</button>
    </div>
  </div>

  <script src="clock.js"></script>
</body>
</html>
