<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>TAIO Motivation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="app-icon">💡</div>
      <span class="window-title" id="lblTitle">Câu động lực</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn active" id="btnPinWindow" title="Bỏ ghim" aria-label="Pin Window">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
        </svg>
      </button>
      <button class="icon-btn" id="btnClose" title="Đóng" aria-label="Close">&times;</button>
    </div>
  </header>

  <div class="quote-body">
    <div class="author-avatar" id="avatarBox">
      <span id="avatarInitial">T</span>
    </div>
    <div class="quote-details">
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>
  </div>

  <footer>
    <button class="action-btn" id="btnRefresh" title="Đổi câu khác">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span id="lblRefresh">Đổi câu khác</span>
    </button>
    <button class="action-btn" id="btnPinQuote" title="Ghim câu này">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
      </svg>
      <span id="lblPinQuote">Ghim</span>
    </button>
    <button class="action-btn" id="btnHeartQuote" title="Thả tim">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span id="lblHeartQuote">Tim</span>
    </button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
